name: Playwright Tests
permissions:
  contents: read
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci
    - name: Run ESLint
      run: npm run lint
    - name: Run TypeScript typecheck
      run: npm run typecheck
    - name: Prepare Docker artifact directories
      run: |
        mkdir -p playwright-report test-results
        echo "PLAYWRIGHT_UID=$(id -u)" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_GID=$(id -g)" >> "$GITHUB_ENV"
    - name: Build version-matched Playwright image
      run: docker compose --env-file /dev/null build playwright
    - name: Run Chromium smoke test in Docker
      run: docker compose --env-file /dev/null run --rm playwright npm run test:smoke
    - name: Run Playwright tests in Docker
      run: docker compose --env-file /dev/null run --rm playwright npm test
    - name: Run authenticated Chromium tests
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      env:
        APP_EMAIL: ${{ secrets.APP_EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: |
        if [ -z "${APP_EMAIL:-}" ] && [ -z "${APP_PASSWORD:-}" ]; then
          echo "Skipping authenticated tests because GitHub Actions secrets are not configured."
          exit 0
        fi
        if [ -z "${APP_EMAIL:-}" ] || [ -z "${APP_PASSWORD:-}" ]; then
          echo "::error::Configure both APP_EMAIL and APP_PASSWORD secrets to run authenticated tests."
          exit 1
        fi
        docker compose --env-file /dev/null run --rm \
          -e APP_EMAIL -e APP_PASSWORD \
          -e PLAYWRIGHT_HTML_REPORT=/app/playwright-report/authenticated/html \
          -e PLAYWRIGHT_TEST_RESULTS=/app/test-results/authenticated/results \
          playwright npm test -- --project=authenticated-chromium
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
